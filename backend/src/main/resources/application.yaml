server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

kadr:
  local-admin-enabled: ${KADR_LOCAL_ADMIN_ENABLED:false}

spring:
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 260MB
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
